<!DOCTYPE html>

<html lang="zh"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>作業06</title>
    <style>
        h4 {
            color: red;
        }

        label {
            color: blue;
        }

        input {
            color: brown;
        }

        div {
            color: blue;
            margin: 5px;
        }
    </style>
</head>

<body>
    <form id="form01">
        <label>姓名：</label>
        <input type="text" name="name01" value="王光正"><br>

        <label>收件地址：</label>
        <input type="text" name="address01" value="新北市樹林區中華路281號7樓之四"><br>

        <label>電話：</label>
        <input type="tel" name="tel01" value="0936676981"><br>

        <label>電子郵件：</label>
        <input type="email" name="email01" value="kcwang@gm.ttu.edu.tw"><br>

        <label>指定送貨日期：</label>
        <input type="date" name="date01"><br>

        <label>水果種類：（三選一）</label><br>
        <input type="radio" name="fruit" id="fruit01" value="愛文芒果(1箱)">愛文芒果(1箱) 475元<br>
        <input type="radio" name="fruit" id="fruit02" value="有機木瓜(6台斤)">有機木瓜(6台斤) 435元<br>
        <input type="radio" name="fruit" id="fruit03" value="黑鑽石蓮霧(5台斤)">黑鑽石蓮霧(5台斤) 749元<br>
    </form>
    <br>
    <button onclick="shoppingInfo()" style="color: red; font-size: 1.2em;">結帳</button>
    <div id="demo"><h4>您的購物資訊如下：</h4>姓名：王光正<br>地址：新北市樹林區中華路281號7樓之四<br>電話：0936676981<br>Email：kcwang@gm.ttu.edu.tw<br>指定送貨日期：2025-02-27<br>水果種類: 有機木瓜(6台斤)<br>價格合計: 435元<br></div>

    <script>
        function shoppingInfo() {
            const x = document.getElementById("form01");
            let item = "";
            let price = 0;
            let text = "<h4>您的購物資訊如下：</h4>";
            let i;

            for (i = 0; i < 5; i++) {
                switch (i) {
                    case 0:
                        item = "姓名：";
                        break;
                    case 1:
                        item = "地址：";
                        break;
                    case 2:
                        item = "電話：";
                        break;
                    case 3:
                        item = "Email：";
                        break;
                    case 4:
                        item = "指定送貨日期：";
                        break;
                }
                text += item + x.elements[i].value + "<br>";
            }

            let fruitSelected = false;

            for (i = 5; i <= 7; i++) {
                if (x.elements[i].checked == true) {
                    fruitSelected = true;
                    text += "水果種類: " + x.elements[i].value + "<br>";
                    switch (i) {
                        case 5:
                            price = 475;
                            break;
                        case 6:
                            price = 435;
                            break;
                        case 7:
                            price = 749;
                            break;
                    }
                }
            }

            if (!fruitSelected) {
                text += "<span style='color:red;'>⚠️ 請選擇一種水果！</span><br>";
            }

            text += "價格合計: " + price + "元<br>";
            document.getElementById("demo").innerHTML = text;
        }
    </script>



</body></html>

<!DOCTYPE html>
<!-- saved from url=(0059)https://one-homework.w3spaces-preview.com/home-work-11.html -->
<html lang="zh-Hant"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <title>作業11</title>
  <style>
    @keyframes myanimation {
      0%   { background: red;    left: 80px;  top: 10px;  }
      25%  { background: yellow; left: 380px; top: 10px;  }
      50%  { background: blue;   left: 380px; top: 210px; }
      75%  { background: green;  left: 80px;  top: 210px; }
      100% { background: red;    left: 80px;  top: 10px;  }
    }

    .box {
      width: 100px;
      height: 100px;
      color: white;
      font-weight: bold;
      font-size: x-large;
      border-radius: 50%;
      background-color: lightblue;
      border: none;
      text-align: center;
      line-height: 100px;
      position: absolute;
      animation: myanimation 4s ease-in-out alternate infinite;
    }
    .reverse {
      animation-direction: reverse;
    }
    .highlight {
      background-color: gold;
    }
  </style>

  <!-- ✅ 使用 CDN 確保載入成功 -->
  <script src="./作業11_files/jquery-3.6.0.min.js.下載"></script>

  <script>
    $(document).ready(function() {
      $('#btn1').mouseover(function() {
        $(".box").css("border-radius", "0%");
      });

      $('#btn2').mouseover(function() {
        $(".box").css("border-radius", "50%");
      });

      $('#btn3').mouseover(function() {
        $("#box01").html("B4A32");
      });

      $('#btn4').mouseover(function() {
        $("#box01").html("范翔威");
      });
      $('#btn5').mouseover(function() {
        $(".box").toggleClass("reverse");
});
    });
  </script>
</head>

<body>

  <div class="box" id="box01">BMD</div>

  <input type="button" id="btn1" value="方形"><br>
  <input type="button" id="btn2" value="圓形"><br>
  <input type="button" id="btn3" value="B4A32"><br>
  <input type="button" id="btn4" value="范翔威"><br>
  <input type="button" id="btn5" value="反向移動(需冷卻4秒)"><br>

</body></html>

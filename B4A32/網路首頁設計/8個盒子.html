<!DOCTYPE html>
<!-- saved from url=(0051)https://one-homework.w3spaces.com/home-work-04.html -->
<html lang="zh-Hant"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8個盒子</title>
    <style>
        @font-face {
            font-family: 'Myfont01';
            src: url('fonts/ZhongKai.woff2') format('woff2'),
                 url('fonts/ZhongKai.woff') format('woff');
            font-display: swap;
        }
        @font-face {
            font-family: 'Myfont02';
            src: url('fonts/Zhufeng01.woff2') format('woff2'),
                 url('fonts/Zhufeng01.woff') format('woff');
        }
        @font-face {
            font-family: 'Myfont03';
            src: url('fonts/MSJH.woff2') format('woff2'),
                 url('fonts/MSJH.woff') format('woff');
        }
        @font-face {
            font-family: 'Myfont04';
            src: url('fonts/Biaokai.woff2') format('woff2'),
                 url('fonts/Biaokai.woff') format('woff');
        }

        body {
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .box {
            width: 22%;
            height: 150px;
            margin: 5px;
            padding: 10px;
            text-align: left;
        }

        .box01 { border: 1px solid red; font-family: 'Myfont01', sans-serif; }
        .box02 { border: 3px double #D2B48C; font-family: 'Myfont02', sans-serif; }
        .box03 { border: 3px dashed #FFF9C4; font-family: 'Myfont03', sans-serif; }
        .box04 { border: 4px dotted green; font-family: 'Myfont04', sans-serif; }
        .box05 { border: 1px solid blue; font-family: 'Myfont01', sans-serif; }
        .box06 { border: 3px double lightblue; font-family: 'Myfont02', sans-serif; }
        .box07 { border: 3px dashed purple; font-family: 'Myfont03', sans-serif; }
        .box08 { border: 4px dotted darkgreen; font-family: 'Myfont04', sans-serif; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box01">1. 要知道，不論你是感到受傷或興奮，那個感覺都是在你內的，他人或外在的事物不是你的感覺之成因。</div>
        <div class="box box02">2. 不要總是期待好事發生，你的工作就是：無論發生什麼事，都去寬恕。</div>
        <div class="box box03">3. 這世界存在的真正目的，是給你一個修正自己「不信」的機會。</div>
        <div class="box box04">4. 在你的自由內，沒有任何人能夠阻擋你放下恐懼與不安。</div>
        <div class="box box05">5. 你的情緒導向系統是對準愛的，所以任何缺乏愛的經驗，都會給你負面的情緒回饋。</div>
        <div class="box box06">6. 喜悅是你的本質，它是你的本我在沒有制約的狀況下所散發的感覺。</div>
        <div class="box box07">7. 凡是對結局肯定不疑的人，才可能毫不焦慮地耐心等候。</div>
        <div class="box box08">8. 在上帝的世界裡，問題不是靠方法去「解決」，而是經由確立「態度」去「決定」的。</div>
    </div>


</body></html>
